<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarqueMed - Cadastro de Paciente</title>
    <link rel="stylesheet" href="css/stylesheet.css">
    <style>
        /* O select do perfil precisa do mesmo visual dos campos de texto. */
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
        select:focus {
            outline: none;
            border-color: #1e3c72;
        }
        #msg a {
            color: #1e3c72;
        }
        button:disabled {
            background-color: #9aa7bd;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

 <div class="container">

    <h1>Cadastro do Paciente</h1>

    <div class="grupo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite o nome">
    </div>

    <div class="grupo">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite o email">
    </div>

    <div class="linha">
        <div class="grupo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Senha">
        </div>

        <div class="grupo">
            <label for="ra">ID do paciente</label>
            <input type="text" id="ra" placeholder="Carteirinha do convênio ou número do SUS">
        </div>
    </div>

    <div class="linha">
        <div class="grupo">
            <label for="perfil">Perfil</label>
            <select id="perfil"></select>
        </div>

        <div class="grupo">
            <label for="data_de_nascimento">Data de Nascimento</label>
            <input type="date" id="data_de_nascimento">
        </div>
    </div>

    <div class="linha">
        <div class="grupo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="Digite o CPF (opcional)">
        </div>

        <div class="grupo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" placeholder="Digite o CEP">
        </div>

        <div class="grupo" style="display:flex; align-items:end;">
            <button type="button" onclick="buscarCep()">Buscar CEP</button>
        </div>
    </div>

    <div class="linha">
        <div class="grupo">
            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" placeholder="Rua, Av...">
        </div>
        <div class="grupo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro">
        </div>
    </div>

    <div class="linha">
        <div class="grupo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade">
        </div>

        <div class="grupo">
            <label for="estado">Estado</label>
            <input type="text" id="estado">
        </div>
    </div>

    <button type="button" id="btnCadastrar" onclick="cadastrar()">Cadastrar</button>

    <div id="links-login">
        <a href="login.html">Login</a>
        <a href="index.html">Voltar ao sistema</a>
    </div>

    <p id="msg"></p>

 </div>

<script>
// Endereço da API (mesmo usado pelas telas do sistema)
const API_BASE_CADASTRO = 'http://127.0.0.1:8000';

// Mostra uma mensagem de sucesso ou erro abaixo do formulário.
// `html` é opcional: usado quando a mensagem tem link.
function mostrarMsg(texto, tipo, html) {
    const msg = document.getElementById("msg");
    msg.className = tipo;
    if (html) msg.innerHTML = html;
    else msg.innerText = texto;
}

// Converte o erro retornado pela API em texto legível.
// Erros de validação (422) vêm com "detail" como lista de objetos.
function textoDoErro(corpo) {
    const detalhe = corpo && corpo.detail;
    if (Array.isArray(detalhe)) {
        return detalhe.map(function (d) { return d.msg; }).join(" ");
    }
    return detalhe || "Erro ao salvar cadastro.";
}

// Preenche o select de perfis a partir da API e libera o botão quando há perfis.
async function carregarPerfis() {
    const sel = document.getElementById("perfil");
    const btn = document.getElementById("btnCadastrar");
    try {
        const resposta = await fetch(API_BASE_CADASTRO + "/perfis/");
        if (!resposta.ok) throw new Error("Falha ao carregar perfis");
        const perfis = await resposta.json();

        sel.innerHTML = '<option value="">Selecione um perfil</option>';
        perfis.forEach(function (p) {
            const opt = document.createElement("option");
            opt.value = p.id_perfil;
            opt.textContent = p.ds_perfil;
            sel.appendChild(opt);
        });

        if (perfis.length === 0) {
            // Sem perfis não há como cadastrar paciente: orienta o usuário.
            btn.disabled = true;
            mostrarMsg("", "erro",
                'Nenhum perfil cadastrado. Cadastre um perfil antes de cadastrar pacientes: ' +
                '<a href="index.html#telaCadastro">criar perfil</a>.');
        } else {
            btn.disabled = false;
        }
    } catch (err) {
        btn.disabled = true;
        mostrarMsg("Não foi possível conectar ao servidor. Verifique se a API está em execução.", "erro");
    }
}

// =========================
// BUSCAR CEP
// =========================
function buscarCep() {
    let cep = document.getElementById("cep").value.replace(/\D/g, '');
    mostrarMsg("", "");

    if (cep.length !== 8) {
        mostrarMsg("Por favor, digite um CEP válido com 8 números.", "erro");
        return;
    }

    fetch("https://viacep.com.br/ws/" + cep + "/json/")
        .then(function (res) { return res.json(); })
        .then(function (data) {
            if (data.erro) {
                mostrarMsg("CEP não encontrado.", "erro");
                return;
            }
            document.getElementById("logradouro").value = data.logradouro || "";
            document.getElementById("bairro").value = data.bairro || "";
            document.getElementById("cidade").value = data.localidade || "";
            document.getElementById("estado").value = data.uf || "";
        })
        .catch(function () {
            mostrarMsg("Erro ao buscar o CEP. Verifique sua conexão.", "erro");
        });
}

// =========================
// CADASTRAR (POST /usuarios/)
// =========================
function cadastrar() {
    const valor = function (id) { return document.getElementById(id).value.trim(); };

    const nome = valor("nome");
    const email = valor("email");
    const senha = document.getElementById("senha").value;
    const ra = valor("ra");
    const idPerfil = parseInt(document.getElementById("perfil").value || "0", 10);

    if (!nome || !ra || !email || !senha || !idPerfil) {
        mostrarMsg("Preencha os campos obrigatórios (Nome, ID do paciente, Email, Senha e Perfil).", "erro");
        return;
    }

    // Campos vazios são enviados como null (a API aceita opcionais nulos).
    const dados = {
        ra: ra,
        nome: nome,
        email: email,
        senha: senha,
        id_perfil: idPerfil,
        cpf: valor("cpf") || null,
        cep: valor("cep") || null,
        data_de_nascimento: valor("data_de_nascimento") || null
    };

    fetch(API_BASE_CADASTRO + "/usuarios/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
    })
    .then(async function (res) {
        if (!res.ok) {
            let corpo = null;
            try { corpo = await res.json(); } catch (e) {}
            throw new Error(textoDoErro(corpo));
        }
        return res.json();
    })
    .then(function () {
        mostrarMsg("Paciente cadastrado com sucesso!", "sucesso");
        // Limpa os dados do paciente, mas mantém o perfil escolhido.
        document.querySelectorAll("input").forEach(function (el) { el.value = ""; });
        document.getElementById("nome").focus();
    })
    .catch(function (err) {
        // "Failed to fetch" indica que a API não respondeu (rede ou servidor desligado).
        const naoConectou = err instanceof TypeError;
        mostrarMsg(naoConectou
            ? "Não foi possível conectar ao servidor. Verifique se a API está em execução."
            : (err.message || "Erro ao salvar cadastro."), "erro");
    });
}

window.addEventListener("load", carregarPerfis);
</script>
</body>
</html>
